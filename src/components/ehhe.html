<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Pinyon+Script&family=Bodoni+Moda:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ec;
    --maroon: #5e0f17;
    --pink: #d4a9b0;
    --r: 6px;      /* perforation radius */
    --s: 20px;     /* distance between perforations */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    padding: 40px 16px 60px;
    font-family: "Inter", system-ui, sans-serif;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  /* ---------- heading ---------- */
  .title { margin: 0 0 40px; line-height: 1; text-align: center; }
  .title .script {
    display: block;
    font-family: "Pinyon Script", "Snell Roundhand", cursive;
    font-size: clamp(3rem, 9vw, 5.2rem);
    color: #c4161c;
    font-weight: 400;
  }
  .title .caps {
    display: block;
    font-family: "Bodoni Moda", "Didot", "Playfair Display", serif;
    font-size: clamp(2.4rem, 7.5vw, 4.2rem);
    font-weight: 400;
    color: #2a2a2a;
    margin-top: -.12em;
  }

  /* ---------- scattered cards ---------- */
  .board {
    position: relative;
    height: 640px;
  }

  /* wrapper carries tilt + shadow (shadow must sit outside the mask) */
  .card {
    position: absolute;
    width: 52%;
    filter: drop-shadow(0 8px 10px rgba(60, 20, 25, .22));
  }
  .card:nth-child(1) { top: 20px;  left: 0;    transform: rotate(-4deg); z-index: 2; }
  .card:nth-child(2) { top: 0;     right: 0;   transform: rotate(3deg);  z-index: 1; }
  .card:nth-child(3) { top: 300px; left: 20%;  transform: rotate(-2deg); z-index: 3; }

  /* the stamp: body with scalloped (perforated) edges via mask */
  .stamp {
    padding: 34px 30px 28px;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    background: var(--bg);
    color: var(--fg);

    -webkit-mask:
      linear-gradient(#000 0 0) center / calc(100% - var(--r) * 2) calc(100% - var(--r) * 2) no-repeat,
      radial-gradient(circle at 50% 0,    #0000 var(--r), #000 calc(var(--r) + .5px)) center top    / var(--s) var(--r) repeat-x,
      radial-gradient(circle at 50% 100%, #0000 var(--r), #000 calc(var(--r) + .5px)) center bottom / var(--s) var(--r) repeat-x,
      radial-gradient(circle at 0 50%,    #0000 var(--r), #000 calc(var(--r) + .5px)) left center   / var(--r) var(--s) repeat-y,
      radial-gradient(circle at 100% 50%, #0000 var(--r), #000 calc(var(--r) + .5px)) right center  / var(--r) var(--s) repeat-y;
            mask:
      linear-gradient(#000 0 0) center / calc(100% - var(--r) * 2) calc(100% - var(--r) * 2) no-repeat,
      radial-gradient(circle at 50% 0,    #0000 var(--r), #000 calc(var(--r) + .5px)) center top    / var(--s) var(--r) repeat-x,
      radial-gradient(circle at 50% 100%, #0000 var(--r), #000 calc(var(--r) + .5px)) center bottom / var(--s) var(--r) repeat-x,
      radial-gradient(circle at 0 50%,    #0000 var(--r), #000 calc(var(--r) + .5px)) left center   / var(--r) var(--s) repeat-y,
      radial-gradient(circle at 100% 50%, #0000 var(--r), #000 calc(var(--r) + .5px)) right center  / var(--r) var(--s) repeat-y;
  }

  .stamp.white  { --bg: #ffffff;      --fg: #3b1a1f; --av-bg: var(--maroon); --av-fg: #fff; }
  .stamp.pink   { --bg: var(--pink);  --fg: #6a1624; --av-bg: var(--maroon); --av-fg: #fff; }
  .stamp.maroon { --bg: var(--maroon);--fg: #f7ebe8; --av-bg: #fff;          --av-fg: var(--maroon); }

  .stars { font-size: 1.15rem; letter-spacing: 4px; color: var(--stars, currentColor); }
  .stamp.white .stars, .stamp.pink .stars { color: var(--maroon); }

  .text { margin: 14px 0 0; font-size: .95rem; line-height: 1.55; }

  .who { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--av-bg);
    color: var(--av-fg);
    display: grid; place-items: center;
    font-size: 1.15rem; font-weight: 500;
    flex: none;
  }
  .name { font-weight: 600; font-size: .9rem; }

  .hand {
    font-family: "Caveat", "Segoe Script", cursive;
    font-size: 2rem;
    color: var(--maroon);
    text-align: center;
    transform: rotate(-3deg);
    margin: 10px 0 0;
  }

  /* ---------- phones: stack the cards, keep the tilt ---------- */
  @media (max-width: 720px) {
    .board { height: auto; display: flex; flex-direction: column; gap: 26px; }
    .card { position: relative; width: 90%; inset: auto !important; }
    .card:nth-child(1) { align-self: flex-start; }
    .card:nth-child(2) { align-self: flex-end; }
    .card:nth-child(3) { align-self: center; }
    .stamp { min-height: 0; padding: 30px 24px 24px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1 class="title">
    <span class="script">Customer</span>
    <span class="caps">REVIEW</span>
  </h1>

  <div class="board" id="board"></div>

  <p class="hand">Happy customers, happy us!</p>
</div>

<script>
  // ✏️ Yahan apne 3 reviews likho (color: white / pink / maroon)
  const reviews = [
    { name: "Quinn",    color: "white",  stars: 5, text: "She has such a in depth understanding of the science behind aesthetics. She is able to talk about it but with such ease that anyone can understand. She's so sweet and patient and provides patient-centred care." },
    { name: "Alex",     color: "pink",   stars: 5, text: "Eliza is highly experienced, thorough and pleasant professional. She was knowledgeable and detailed in explaining the procedure and very gentle performing it. Highly recommend Eliza to everybody" },
    { name: "Courtney", color: "maroon", stars: 5, text: "Eliza is incredible. She is so thorough, very knowledgeable & skilled, but also is just an all around delight to be around making the treatments so relaxed & comfortable. She makes it very easy for the at home treatments, because she also makes you feel right at home." }
  ];

  document.getElementById("board").innerHTML = reviews.slice(0, 3).map(r => `
    <div class="card">
      <article class="stamp ${r.color}">
        <div>
          <div class="stars" aria-label="${r.stars} out of 5 stars">${"\u2605".repeat(r.stars)}</div>
          <p class="text">${r.text}</p>
        </div>
        <div class="who">
          <div class="avatar">${r.name[0]}</div>
          <div class="name">${r.name}</div>
        </div>
      </article>
    </div>`).join("");
</script>
</body>
</html>
