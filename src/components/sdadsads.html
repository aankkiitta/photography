<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio - Gallery</title>

<style>
/* Font Import */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #ffffff; 
  font-family: 'Inter', sans-serif;
  color: #111;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

/* Main Layout Container */
.main-container {
  display: flex;
  align-items: center; /* Vertically center everything */
  justify-content: center;
  padding: 40px;
  gap: 40px;
  max-width: 1600px;
  width: 100%;
}

/* --- LEFT SIDE: GALLERY & CONTROLS --- */
.gallery-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 700px;
}

.gallery-section {
  position: relative;
  width: 100%;
  height: 600px;
  display: flex;
  align-items: center;
  justify-content: center; /* Center the stack */
}

.card-stage {
  position: relative;
  width: 100%;
  height: 100%;
}

.card {
  position: absolute;
  overflow: hidden;
  background: #eee;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: 
    transform 600ms cubic-bezier(0.25, 1, 0.5, 1),
    opacity 600ms ease,
    z-index 0s;
  will-change: transform;
  top: 50%; 
  left: 50%; /* Center horizontally */
}

.card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  user-select: none;
  filter: grayscale(60%) brightness(0.9); 
  transition: filter 600ms ease;
}

.card.active img {
  filter: grayscale(0%) brightness(1);
}

/* Card Info overlay */
.card-info {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 40px 30px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 400ms ease, transform 400ms ease;
  pointer-events: none;
  color: white;
}

.card.active .card-info {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 200ms;
}

.card-info small {
  display: block;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 8px;
  color: #ddd;
}

.card-info h2 {
  font-size: 26px;
  font-weight: 400;
}

/* --- Navigation Controls (Fixed Alignment) --- */
.controls-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin-top: 30px; 
  width: 100%;
}

.hint {
  color: #888;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.navigation {
  display: flex;
  gap: 20px;
}

.navigation button {
  width: 55px;
  height: 55px;
  background: transparent;
  border: 1px solid #ccc;
  border-radius: 50%;
  color: #333;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Double Arrow CSS (Using SVG to match the second image) */
.navigation button svg {
  width: 24px;
  height: 24px;
  fill: #333;
  transition: all 0.3s ease;
}

.navigation button:hover {
  border-color: #333;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* Hover gradient effect for arrows */
.navigation button:hover svg path:first-child {
  fill: #999; /* Light grey for back arrow */
}
.navigation button:hover svg path:last-child {
  fill: #111; /* Dark for front arrow */
}


/* --- MIDDLE: PORTFOLIO TITLE --- */
.title-divider {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0 40px;
}

.title-divider h1 {
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 8px; /* Spaced out look */
  text-transform: uppercase;
  writing-mode: vertical-rl; /* Vertical text looks good between elements */
  transform: rotate(180deg);
  color: #111;
  margin-bottom: 30px;
}

/* Optional line for design */
.title-divider .line {
  width: 1px;
  height: 80px;
  background: #ddd;
}

/* --- RIGHT SIDE: TEXT & BUTTON --- */
.text-section {
  flex: 1;
  max-width: 450px;
  transition: opacity 0.3s ease;
  padding-left: 20px;
}

.text-section.fade-out {
  opacity: 0;
}

.text-section h2 {
  font-size: 52px; 
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: 20px;
  color: #111;
}

.text-section p {
  font-size: 16px;
  line-height: 1.7;
  color: #555;
  margin-bottom: 40px;
}

.see-more-btn {
  display: inline-block;
  padding: 15px 40px;
  background-color: #ffffff;
  color: #111;
  border: 1px solid #111;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
}

.see-more-btn:hover {
  background-color: #111;
  color: #ffffff;
}

/* --- RESPONSIVE DESIGN --- */
@media (max-width: 1200px) {
  .main-container { gap: 20px; }
  .gallery-wrapper { width: 600px; }
  .gallery-section { height: 500px; }
}

@media (max-width: 992px) {
  .main-container {
    flex-direction: column;
    padding-top: 60px;
    gap: 40px;
  }
  
  .title-divider {
    padding: 20px 0;
  }
  
  /* Horizontal text on mobile */
  .title-divider h1 {
    writing-mode: horizontal-tb;
    transform: none;
    margin-bottom: 0;
  }
  .title-divider .line { display: none; }

  .gallery-wrapper {
    width: 100%;
    max-width: 600px;
  }
  
  .text-section {
    text-align: center;
    padding-left: 0;
    padding-bottom: 40px;
  }
  .text-section h2 { font-size: 38px; }
}
</style>
</head>

<body>

  <main class="main-container">

    <!-- Left Side: Gallery & Controls -->
    <div class="gallery-wrapper">
      <section class="gallery-section">
        <div class="card-stage" id="cardStage">
          
          <article class="card" data-title="Modern Muse" data-desc="A striking exploration of contemporary fashion, blending bold silhouettes with subtle textures.">
            <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=80" alt="Editorial">
            <div class="card-info">
              <small>COLLECTION 01</small>
              <h2>Modern Muse</h2>
            </div>
          </article>

          <article class="card" data-title="Soft Elegance" data-desc="Capturing the delicate balance between light and shadow, featuring striking blue tones and serene expressions.">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80" alt="Portrait">
            <div class="card-info">
              <small>COLLECTION 02</small>
              <h2>Soft Elegance</h2>
            </div>
          </article>

          <article class="card" data-title="New Perspective" data-desc="An intimate portrait series that challenges traditional angles and highlights raw, authentic emotion.">
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1000&q=80" alt="Portrait">
            <div class="card-info">
              <small>COLLECTION 03</small>
              <h2>New Perspective</h2>
            </div>
          </article>

          <article class="card" data-title="Timeless Form" data-desc="Classic studio photography focusing on architectural lines and the timeless beauty of human form.">
            <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1000&q=80" alt="Studio">
            <div class="card-info">
              <small>COLLECTION 04</small>
              <h2>Timeless Form</h2>
            </div>
          </article>

        </div>
      </section>

      <!-- Controls now placed perfectly below the images -->
      <div class="controls-wrapper">
        <div class="hint">CLICK A CARD TO EXPLORE</div>
        <div class="navigation">
          <!-- Using SVG for Double Arrows to match your image -->
          <button id="prev" aria-label="Previous">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12.5 6L6 12l6.5 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M19 6l-6.5 6 6.5 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
          <button id="next" aria-label="Next">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 6l6.5 6L5 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M11.5 6l6.5 6-6.5 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Middle: Portfolio Title -->
    <div class="title-divider">
      <h1>Portfolio</h1>
      <div class="line"></div>
    </div>

    <!-- Right Side: Text & Button -->
    <section class="text-section" id="textSection">
      <h2 id="dynamicTitle">Modern Muse</h2>
      <p id="dynamicDesc">A striking exploration of contemporary fashion, blending bold silhouettes with subtle textures.</p>
      <a href="#" class="see-more-btn">See More</a>
    </section>

  </main>

<script>
const stage = document.getElementById("cardStage");
const cards = [...stage.querySelectorAll(".card")];
const textSection = document.getElementById("textSection");
const dynamicTitle = document.getElementById("dynamicTitle");
const dynamicDesc = document.getElementById("dynamicDesc");

let activeIndex = 0;

function renderCards() {
  const isMobile = window.innerWidth <= 992;
  
  const baseWidth = isMobile ? 280 : 360; 
  const baseHeight = isMobile ? 380 : 500;

  cards.forEach((card, index) => {
    const offset = (index - activeIndex + cards.length) % cards.length;

    let width = baseWidth - (offset * 50);
    let height = baseHeight - (offset * 60);
    
    // Center alignment logic
    // For X: offset moves right, minus half width keeps it centered on its own axis
    let translateX = (offset * (isMobile ? 50 : 70)) - (width / 2);
    // For Y: move down slightly, minus half height centers it vertically
    let translateY = (offset * 20) - (height / 2); 

    card.style.width = `${width}px`;
    card.style.height = `${height}px`;
    card.style.transform = `translate(${translateX}px, ${translateY}px)`;
    card.style.zIndex = 10 - offset;
    card.style.opacity = offset === 3 ? "0.6" : "1";

    card.classList.toggle("active", offset === 0);
  });

  // Dynamic Text Update
  const activeCard = cards[activeIndex];
  const newTitle = activeCard.getAttribute("data-title");
  const newDesc = activeCard.getAttribute("data-desc");

  textSection.classList.add("fade-out");

  setTimeout(() => {
    dynamicTitle.textContent = newTitle;
    dynamicDesc.textContent = newDesc;
    textSection.classList.remove("fade-out");
  }, 300); 
}

// Interactions
cards.forEach((card, index) => {
  card.addEventListener("click", () => {
    if (index === activeIndex) {
      activeIndex = (activeIndex + 1) % cards.length;
    } else {
      activeIndex = index;
    }
    renderCards();
  });
});

document.getElementById("next").addEventListener("click", () => {
  activeIndex = (activeIndex + 1) % cards.length;
  renderCards();
});

document.getElementById("prev").addEventListener("click", () => {
  activeIndex = (activeIndex - 1 + cards.length) % cards.length;
  renderCards();
});

window.addEventListener("resize", () => {
  clearTimeout(window.resizeTimer);
  window.resizeTimer = setTimeout(renderCards, 100);
});

renderCards();
</script>

</body>
</html>
